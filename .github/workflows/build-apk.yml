name: Build APK

# Se ejecuta a mano: pestaña Actions -> "Build APK" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.01: llave de firma FIJA. Antes, cada ejecucion creaba una llave debug nueva y
      # Android rechazaba la actualizacion ("conflicto con el paquete"). Ahora la llave se
      # crea una sola vez, se guarda en el repo (pulsar-debug.keystore) y se reutiliza siempre.
      - name: Llave de firma estable
        run: |
          if [ ! -f pulsar-debug.keystore ]; then
            keytool -genkeypair -keystore pulsar-debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add pulsar-debug.keystore
            git commit -m "Agregar llave de firma estable para actualizar el APK"
            git push
          fi
          mkdir -p ~/.android
          cp pulsar-debug.keystore ~/.android/debug.keystore

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Preparar la web (carpeta www)
        run: |
          mkdir www
          cp index.html script.js style.css www/
          cp icon-*.png www/
          cp apple-touch-icon.png www/ 2>/dev/null || true

      - name: Instalar Capacitor y crear el proyecto Android
        run: |
          npm install
          npx cap add android

      - name: Personalizar (iconos, puente de icono, version 1.01)
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          import glob, os, re
          from PIL import Image

          APP_ID = "com.pulsarrm.app"
          MAIN = "android/app/src/main"
          RES = MAIN + "/res"

          # ---------- 1) Manifest: dos alias de icono (Dark = por defecto, Light) ----------
          path = MAIN + "/AndroidManifest.xml"
          xml = open(path, encoding="utf-8").read()

          launcher = re.compile(
              r'\s*<intent-filter>\s*<action android:name="android.intent.action.MAIN"\s*/>\s*'
              r'<category android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>')
          xml, n = launcher.subn("", xml, count=1)
          assert n == 1, "No encontre el intent-filter LAUNCHER"

          xml = xml.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@mipmap/ic_launcher_dark"')
          xml = re.sub(r'\s*android:roundIcon="[^"]*"', "", xml)

          alias = """
                  <activity-alias
                      android:name=".IconDark"
                      android:targetActivity=".MainActivity"
                      android:enabled="true"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:icon="@mipmap/ic_launcher_dark">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>

                  <activity-alias
                      android:name=".IconLight"
                      android:targetActivity=".MainActivity"
                      android:enabled="false"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:icon="@mipmap/ic_launcher_light">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity-alias>

              </application>"""
          assert xml.count("</application>") == 1
          xml = xml.replace("</application>", alias)
          open(path, "w", encoding="utf-8").write(xml)

          # ---------- 2) MainActivity con el puente "PulsarNative" ----------
          java = '''package %s;

          import android.content.ComponentName;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getBridge().getWebView().addJavascriptInterface(new IconBridge(), "PulsarNative");
              }

              private SharedPreferences prefs() {
                  return getSharedPreferences("pulsar", MODE_PRIVATE);
              }

              /** La web llama a PulsarNative.setPendingIcon("light" | "dark"). Solo guarda la eleccion. */
              private class IconBridge {
                  @JavascriptInterface
                  public void setPendingIcon(String variant) {
                      prefs().edit().putString("icon", "light".equals(variant) ? "light" : "dark").apply();
                  }
              }

              /** El icono se cambia al salir/cerrar la app. */
              @Override
              public void onStop() {
                  super.onStop();
                  boolean light = "light".equals(prefs().getString("icon", "dark"));
                  if (light) {
                      setAlias("IconLight", true);
                      setAlias("IconDark", false);
                  } else {
                      setAlias("IconDark", true);
                      setAlias("IconLight", false);
                  }
              }

              private void setAlias(String name, boolean enabled) {
                  getPackageManager().setComponentEnabledSetting(
                      new ComponentName(getPackageName(), "%s." + name),
                      enabled ? PackageManager.COMPONENT_ENABLED_STATE_ENABLED
                              : PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                      PackageManager.DONT_KILL_APP);
              }
          }
          ''' % (APP_ID, APP_ID)
          files = glob.glob(MAIN + "/java/**/MainActivity.java", recursive=True)
          assert len(files) == 1, files
          open(files[0], "w", encoding="utf-8").write(java)

          # ---------- 3) Iconos del launcher (adaptativos + clasicos) ----------
          variants = {"light": ("icon-light-512.png", "white"), "dark": ("icon-dark-512.png", "black")}
          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          os.makedirs(RES + "/drawable-nodpi", exist_ok=True)
          os.makedirs(RES + "/mipmap-anydpi-v26", exist_ok=True)
          for name, (src, bg) in variants.items():
              im = Image.open(src).convert("RGB")
              im.resize((432, 432), Image.LANCZOS).save(f"{RES}/drawable-nodpi/ic_fg_{name}.png")
              for dens, size in legacy.items():
                  d = f"{RES}/mipmap-{dens}"
                  os.makedirs(d, exist_ok=True)
                  im.resize((size, size), Image.LANCZOS).save(f"{d}/ic_launcher_{name}.png")
              open(f"{RES}/mipmap-anydpi-v26/ic_launcher_{name}.xml", "w").write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  f'    <background android:drawable="@android:color/{bg}"/>\n'
                  '    <foreground>\n'
                  f'        <inset android:drawable="@drawable/ic_fg_{name}" android:inset="20%"/>\n'
                  '    </foreground>\n'
                  '</adaptive-icon>\n')

          # ---------- 4) Version 1.01 ----------
          gradle = MAIN.replace("src/main", "build.gradle")
          g = open(gradle, encoding="utf-8").read()
          g, a = re.subn(r"versionCode\s+\d+", "versionCode 101", g, count=1)
          g, b = re.subn(r'versionName\s+"[^"]*"', 'versionName "1.01"', g, count=1)
          assert a == 1 and b == 1, "No encontre versionCode/versionName"
          open(gradle, "w", encoding="utf-8").write(g)
          print("Proyecto Android personalizado: Pulsar RM V1.01")
          PY

      - name: Sincronizar la web con Android
        run: npx cap sync android

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compilar el APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PulsarRM-V1.01.apk

      - name: Guardar APK (artefacto)
        uses: actions/upload-artifact@v4
        with:
          name: PulsarRM-V1.01
          path: PulsarRM-V1.01.apk

      - name: Publicar en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.01-build${{ github.run_number }}" PulsarRM-V1.01.apk \
            --title "Pulsar RM V1.01" \
            --notes "APK de prueba (firmado con llave debug). Descarga PulsarRM-V1.01.apk e instalalo."
