
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080B16">
    <title>Pulsar RM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">✦</div>
            <span>PULSAR <b>RM</b></span>
        </div>
        <button class="settings" aria-label="Ajustes">⚙</button>
    </header>

    <main>
        <section class="welcome">
            <p class="subtitle">YOUR PERSONAL MUSIC UNIVERSE</p>
            <h1>Tu música.<br>Tu universo.</h1>
            <p class="description">Todo lo que escuchas, en un solo lugar.</p>
        </section>

        <label class="search">
            <span>⌕</span>
            <input id="search" type="search" placeholder="Buscar canciones o artistas...">
        </label>

        <section class="library">
            <div class="section-title">
                <h2>Tu biblioteca</h2>
                <span id="song-count">0 canciones</span>
            </div>

            <div class="tabs">
                <button class="active">Canciones</button>
            </div>

            <div id="song-list" class="song-list">
                <div class="empty">
                    <div class="empty-icon">♫</div>
                    <h3>Tu música te espera</h3>
                    <p>Importa tus archivos de audio<br>y comienza tu universo.</p>
                    <button id="import-button" class="add-music">
                        + Importar música
                    </button>
                </div>
            </div>

            <input id="music-files" type="file" accept="audio/*" multiple hidden>
        </section>
    </main>

    <section id="player" class="player hidden">
        <div class="player-info">
            <div class="cover">♫</div>
            <div class="track-info">
                <strong id="player-title">Sin reproducción</strong>
                <small id="player-artist">Pulsar RM</small>
            </div>
            <button id="play-button" aria-label="Reproducir">▶</button>
        </div>

        <div class="progress-container">
            <span id="current-time">0:00</span>
            <input id="progress" type="range" min="0" max="100" value="0">
            <span id="duration">0:00</span>
        </div>

        <div class="controls">
            <button id="previous-button">⏮</button>
            <button id="main-play-button">▶</button>
            <button id="next-button">⏭</button>
        </div>
    </section>

    <nav class="bottom-nav">
        <span class="selected">⌂<small>Inicio</small></span>
        <span>♫<small>Biblioteca</small></span>
        <span>◉<small>Reproductor</small></span>
        <span>⚙<small>Ajustes</small></span>
    </nav>

</div>

<script src="script.js"></script>
</body>
</html>
